<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>RPi Static IP Topology</title>
  <rect x="0" y="0" width="900" height="420" fill="#fff" stroke="#111"/>
  <text x="20" y="30" font-size="20">RPi Static IP Topology</text>
  <rect x="40" y="80" width="240" height="100" rx="12" fill="#eef" stroke="#333"/>
  <text x="60" y="110" font-size="14">Router/DHCP/DNS</text>
  <text x="60" y="130" font-size="12">192.168.123.1</text>
  <rect x="330" y="80" width="260" height="100" rx="12" fill="#efe" stroke="#333"/>
  <text x="350" y="110" font-size="14">Raspberry Pi (eth0)</text>
  <text x="350" y="130" font-size="12">192.168.123.151/24</text>
  <text x="350" y="148" font-size="12">Wi‑Fi disabled</text>
  <rect x="640" y="80" width="220" height="100" rx="12" fill="#ffe" stroke="#333"/>
  <text x="660" y="110" font-size="14">LAN Clients</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <line x1="280" y1="130" x2="330" y2="130" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="590" y1="130" x2="640" y2="130" stroke="#000" marker-end="url(#arrow)"/>
</svg>
