<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Security Zones and Access</title>
  <rect x="0" y="0" width="1280" height="640" fill="#ffffff" stroke="#111111"/>

  <g font-family="Arial" font-size="16">
    <text x="20" y="36">Security Zones and Access</text>

    <rect x="40" y="80" width="560" height="540" rx="16" ry="16" fill="#f8f8f8" stroke="#aaaaaa"/>
    <text x="60" y="110">LAN Core</text>
    <rect x="60" y="140" width="240" height="110" rx="12" ry="12" fill="#e8f5e9" stroke="#333333"/>
    <text x="80" y="200">Home Assistant / Node-RED</text>
    <rect x="320" y="140" width="240" height="110" rx="12" ry="12" fill="#ede7f6" stroke="#333333"/>
    <text x="340" y="200">InfluxDB / Telegraf</text>
    <rect x="60" y="270" width="240" height="110" rx="12" ry="12" fill="#fff3e0" stroke="#333333"/>
    <text x="80" y="330">MariaDB / HAProxy VIP</text>
    <rect x="320" y="270" width="240" height="110" rx="12" ry="12" fill="#e3f2fd" stroke="#333333"/>
    <text x="340" y="330">MQTT Broker</text>

    <rect x="640" y="80" width="560" height="540" rx="16" ry="16" fill="#f8f8f8" stroke="#aaaaaa"/>
    <text x="660" y="110">IoT and Edge</text>
    <rect x="660" y="140" width="240" height="110" rx="12" ry="12" fill="#f0fff0" stroke="#333333"/>
    <text x="680" y="200">Legrand / Victron</text>
    <rect x="920" y="140" width="240" height="110" rx="12" ry="12" fill="#f0fff0" stroke="#333333"/>
    <text x="940" y="200">Sabiana / Vallox</text>
    <rect x="660" y="270" width="240" height="110" rx="12" ry="12" fill="#f0fff0" stroke="#333333"/>
    <text x="680" y="330">Raspberry Pi / Arduino</text>

    <!-- Simple connector lines (no arrowheads) -->
    <line x1="300" y1="195" x2="640" y2="195" stroke="#000000"/>
    <line x1="300" y1="325" x2="640" y2="325" stroke="#000000"/>
    <text x="320" y="180" font-size="12">Strict firewall allowlist</text>
  </g>

</svg>
