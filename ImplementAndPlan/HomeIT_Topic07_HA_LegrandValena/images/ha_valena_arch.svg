<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <title>Home Assistant + Legrand Valena (Netatmo)</title>
  <rect x="0" y="0" width="1200" height="600" fill="#fff" stroke="#111"/>
  <text x="24" y="40" font-size="24" font-family="Arial">Home Assistant + Legrand Valena (Netatmo)</text>

  <!-- Legrand Gateway -->
  <rect x="60" y="90" width="280" height="130" rx="12" fill="#e8f5e9" stroke="#333"/>
  <text x="80" y="130" font-size="16" font-family="Arial">Legrand Gateway</text>
  <text x="80" y="154" font-size="12" font-family="Arial">Valena (Netatmo) devices</text>

  <!-- Cloud -->
  <rect x="420" y="90" width="240" height="130" rx="12" fill="#e3f2fd" stroke="#333"/>
  <text x="440" y="130" font-size="16" font-family="Arial">Legrand Cloud</text>
  <text x="440" y="154" font-size="12" font-family="Arial">Home+ Control API</text>

  <!-- HA -->
  <rect x="720" y="90" width="260" height="130" rx="12" fill="#fff3e0" stroke="#333"/>
  <text x="740" y="130" font-size="16" font-family="Arial">Home Assistant</text>
  <text x="740" y="154" font-size="12" font-family="Arial">Integrations + Automations</text>

  <!-- Apple Home -->
  <rect x="1020" y="90" width="120" height="130" rx="12" fill="#ede7f6" stroke="#333"/>
  <text x="1030" y="130" font-size="16" font-family="Arial">Apple</text>
  <text x="1030" y="154" font-size="12" font-family="Arial">Home</text>

  <!-- Lines & markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <!-- Path A: cloud -->
  <line x1="340" y1="155" x2="420" y2="155" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="660" y1="155" x2="720" y2="155" stroke="#000" marker-end="url(#arrow)"/>
  <!-- Path B: local HomeKit Controller -->
  <line x1="340" y1="200" x2="720" y2="200" stroke="#000" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="350" y="215" font-size="12" font-family="Arial">HomeKit Controller (LAN)</text>

  <!-- HomeKit Bridge from HA -->
  <line x1="980" y1="155" x2="1020" y2="155" stroke="#000" marker-end="url(#arrow)"/>
  <text x="900" y="148" font-size="12" font-family="Arial">HomeKit Bridge</text>

  <!-- Devices zone -->
  <rect x="60" y="280" width="1060" height="250" rx="14" fill="#f9f9f9" stroke="#aaa"/>
  <text x="80" y="310" font-size="16" font-family="Arial">Devices</text>
  <rect x="80" y="330" width="200" height="80" rx="12" fill="#f0fff0" stroke="#333"/>
  <text x="100" y="370" font-size="12" font-family="Arial">Valena Socket</text>
  <rect x="300" y="330" width="200" height="80" rx="12" fill="#f0fff0" stroke="#333"/>
  <text x="320" y="370" font-size="12" font-family="Arial">Valena Switch</text>
  <rect x="520" y="330" width="200" height="80" rx="12" fill="#f0fff0" stroke="#333"/>
  <text x="540" y="370" font-size="12" font-family="Arial">Ventilation Relay</text>
  <rect x="740" y="330" width="200" height="80" rx="12" fill="#f0fff0" stroke="#333"/>
  <text x="760" y="370" font-size="12" font-family="Arial">Scenes / Scripts</text>
</svg>