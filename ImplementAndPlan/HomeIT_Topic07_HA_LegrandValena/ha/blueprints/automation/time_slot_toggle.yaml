# ha/blueprints/automation/time_slot_toggle.yaml
blueprint:
  name: Toggle during time slot
  description: Turn a switch on at start time and off at end time.
  domain: automation
  input:
    target_switch:
      name: Switch
      selector: { entity: { domain: switch } }
    start_time:
      name: Start time
      selector: { time: {} }
    end_time:
      name: End time
      selector: { time: {} }
trigger:
  - platform: time
    at: !input start_time
  - platform: time
    at: !input end_time
action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().strftime('%H:%M:%S') == (start_time|default('00:00:00')) }}"
        sequence:
          - service: switch.turn_on
            target: { entity_id: !input target_switch }
    default:
      - service: switch.turn_off
        target: { entity_id: !input target_switch }
mode: single